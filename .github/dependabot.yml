version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: 13 4 8 * *
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    open-pull-requests-limit: 15
    versioning-strategy: increase
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
      # Held at ~2.14.4 on purpose; a minor bump would be auto-merged.
      - dependency-name: '@iobroker/types-vis-2'
        update-types:
          - version-update:semver-minor
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: 37 4 8 * *
      timezone: Europe/Berlin
    open-pull-requests-limit: 15
  - package-ecosystem: npm
    directory: /src-widgets-ts
    schedule:
      interval: cron
      cronjob: 19 4 8 * *
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    open-pull-requests-limit: 15
    versioning-strategy: increase
    ignore:
      # Held at ~2.14.4 on purpose; a minor bump would be auto-merged.
      - dependency-name: '@iobroker/types-vis-2'
        update-types:
          - version-update:semver-minor
